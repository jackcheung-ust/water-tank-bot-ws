collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    # state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout : 1.0
    base_shift_correction: False
    stop_pub_timeout : 2.0
    enable_stamped_cmd_vel: True

    polygons: ["StopCircle"] # List both zones here
    # polygons: ["SlowdownCircle", "StopCircle"]
    
    # Recommended: A larger circle to slow down
    # SlowdownCircle:
    #   type: "circle"
    #   action_type: "slowdown"
    #   radius: 0.6 # Example: 0.6m radius for slowing down
    #   slowdown_ratio: 0.3 # Slow down to 30% of current speed
    #   time_before_collision: 1.5 # Slightly more time for slowdown
    #   simulation_time_step: 0.1
    #   min_points: 3 # Fewer points might trigger slowdown earlier
    #   visualize: true # Recommended for tuning
    #   enabled: True

    # A circle representing the immediate stop zone
    StopCircle:
      type: "circle"
      action_type: "stop"
      radius: 0.35 # Slightly larger than robot's 0.3m radius for buffer
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: true # Recommended for tuning
      enabled: True

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True
